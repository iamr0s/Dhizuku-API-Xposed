import java.util.Properties

plugins {
    alias libs.plugins.agp.app
}

def keystoreDir = "$rootDir/keystore"
def keystoreProps = new Properties()
for (name in ["r0s.properties", "debug.properties"]) {
    def f = file("$keystoreDir/$name")
    if (!f.exists()) continue
    keystoreProps.load(f.newInputStream())
    break
}

android {
    namespace = "com.rosan.dhizuku.api.xposed"
    compileSdk = 36

    defaultConfig {
        minSdk = 23
        targetSdk = compileSdk

        def versionProps = new Properties()
        file("$rootDir/version.properties").withInputStream { versionProps.load(it) }
        versionCode = versionProps.getProperty("versionCode").toInteger()
        versionName = versionProps.getProperty("versionName")

        multiDexEnabled = false
        proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
    }

    signingConfigs {
        base {
            keyAlias = keystoreProps.getProperty("keyAlias")
            keyPassword = keystoreProps.getProperty("keyPassword")
            storeFile = file("$keystoreDir/${keystoreProps.getProperty("storeFile")}")
            storePassword = keystoreProps.getProperty("storePassword")

        }
    }

    buildTypes {
        configureEach {
            signingConfig = signingConfigs.base
            minifyEnabled = false
        }
        release {
            minifyEnabled = true
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

}

dependencies {
    compileOnly project(":hidden-api")

    compileOnly libs.xposed.api
    implementation libs.dhizuku
}
